<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch World — Luxury & Everyday Watches</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #111; color: #fff; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px; background: #1a1a1a; border-bottom: 1px solid #2c2c2c;
    }
    .logo { font-size: 1.3rem; font-weight: bold; color: #e5b84b; }
    .cart { background: #e5b84b; color: #111; padding: 6px 12px; border-radius: 20px; font-weight: bold; }
    .hero { text-align: center; padding: 48px 20px; background: #181818; }
    .hero h1 { font-size: 2rem; margin-bottom: 10px; }
    .hero p { color: #bbb; margin-bottom: 20px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px; padding: 24px; max-width: 1000px; margin: auto;
    }
    .card { background: #1c1c1c; border: 1px solid #2d2d2d; border-radius: 10px; padding: 16px; text-align: center; }
    .card h3 { margin: 10px 0 6px; }
    .price { color: #e5b84b; font-weight: bold; margin-bottom: 12px; }
    button {
      background: #e5b84b; color: #111; border: none; padding: 10px 16px;
      border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <header>
    <div class="logo">WATCH WORLD</div>
    <div class="cart">Cart: <span id="cart-count">0</span></div>
  </header>

  <section class="hero">
    <h1>Timeless Style on Your Wrist</h1>
    <p>Explore classic, sport, and modern watches.</p>
  </section>

  <section class="grid">
    <div class="card">
      <h3>Chrono Classic</h3>
      <div class="price">$120</div>
      <button onclick="addToCart()">Add to Cart</button>
    </div>
    <div class="card">
      <h3>Sport Pro Diver</h3>
      <div class="price">$150</div>
      <button onclick="addToCart()">Add to Cart</button>
    </div>
    <div class="card">
      <h3>Minimalist Leather</h3>
      <div class="price">$95</div>
      <button onclick="addToCart()">Add to Cart</button>
    </div>
  </section>

  <script>
    let count = 0;
    function addToCart() {
      count++;
      document.getElementById("cart-count").innerText = count;
    }
  </script>
</body>
</html>
